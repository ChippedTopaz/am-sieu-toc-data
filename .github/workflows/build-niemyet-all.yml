name: Build All Niemyet Province Data

on:
  schedule:
    # 00:20 giờ Việt Nam mỗi ngày (17:20 UTC), chạy sau Master Data 20 phút để tránh race.
    - cron: '20 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: niemyet-data-deploy
  cancel-in-progress: false

jobs:
  build-all-provinces:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout branch niemyet
        uses: actions/checkout@v4
        with:
          ref: niemyet

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Build all 34 province datasets
        run: node build-niemyet-data.js
        env:
          PROVINCE_CODE: ''

      - name: Prepare orphan publish snapshot
        run: |
          rm -rf niemyet-publish
          mkdir -p niemyet-publish
          cp -R province-configs niemyet-publish/province-configs

      - name: Deploy generated data to niemyet-data
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./niemyet-publish
          publish_branch: niemyet-data
          force_orphan: true
          commit_message: "Build niemyet delivery data for all 34 provinces"
