name: TCI Calibration

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/tci-calibration.yml'
      - 'tci/select-tci-calibration.js'
      - 'tci/select-golden-cases.js'
      - 'tci/export-golden-review.js'
      - 'tci/analyze-golden-calibration.js'
      - 'tci/build-calibration-matrix.js'
      - 'tci-results/tci-calibration-matrix-v1.json'
      - 'details/**'

permissions:
  contents: write

jobs:
  select:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout calibration branch
        uses: actions/checkout@v4
        with:
          ref: tci-calibration
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Select TCI calibration cases
        run: node tci/select-tci-calibration.js
      - name: Select Golden Cases
        run: node tci/select-golden-cases.js
      - name: Export Golden Review Evidence
        run: node tci/export-golden-review.js
      - name: Analyze Golden Calibration
        run: node tci/analyze-golden-calibration.js
      - name: Build Calibration Matrix
        run: node tci/build-calibration-matrix.js
      - name: Commit calibration results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tci-results
          git diff --cached --quiet || git commit -m "TCI: generate calibration matrix and refined Golden analysis"
          git push origin HEAD:tci-calibration
